# Morphogen judges every pull request that changes the agent's rules (agent/**), from this definition on main
# (pull_request_target), so a pull request cannot change what judges it. The judge commit and the sandbox image
# are pinned; the verdict is posted by the judge's GitHub App (M-05).
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ["agent/**"]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@21b347f669b243e01fbd7aabd8c16af1b57fed6c
    permissions: {contents: read, statuses: write, id-token: write, actions: write}
    secrets: inherit
    with:
      judge-ref: 21b347f669b243e01fbd7aabd8c16af1b57fed6c
      cases-repo: OpenReplicant/morphogen-judge
      module: metasoar.play
      sandbox-image: ghcr.io/openreplicant/metasoar-sandbox@sha256:2b18ab782727b7fd1ce4ddbb3dc11b48957618d785d35221d31c9ba63d7f65e4
      case-timeout: 60
      verdict-poster: app
