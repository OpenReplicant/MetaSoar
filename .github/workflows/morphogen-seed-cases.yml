# One-off per set: create one of MetaSoar's held-out case sets in the private repository OpenReplicant/morphogen-judge, from fresh
# randomness inside this run, so the seeds exist only there (as Morphogen's own dogfood does). Needs
# MORPHOGEN_CASES_TOKEN in the morphogen-judge environment. Refuses to overwrite an existing set.
# Run by hand: Actions -> morphogen-seed-cases -> Run workflow.
name: morphogen-seed-cases
on:
  workflow_dispatch:
    inputs:
      set:
        description: which case set to create
        type: choice
        options: [babyai-heldout, arc3-heldout]
        default: babyai-heldout
permissions: {}
jobs:
  seed:
    runs-on: ubuntu-24.04
    environment: morphogen-judge
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - env:
          CASES_TOKEN: ${{ secrets.MORPHOGEN_CASES_TOKEN }}
        run: |
          set -eu
          auth="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$CASES_TOKEN" | base64 -w0)"
          git -c "$auth" clone -q https://github.com/OpenReplicant/morphogen-judge.git cases
          set="${{ inputs.set }}"
          if [ -e "cases/$set/cases.jsonl" ]; then echo "case set exists; not overwriting"; exit 1; fi
          if [ "$set" = arc3-heldout ]; then
            python3 -m venv /tmp/arc && /tmp/arc/bin/pip install -q arc-agi==0.9.9 arcengine==0.9.3
            /tmp/arc/bin/python .morphogen/make_arc_cases.py --out "cases/$set"
          else
            SEED="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
              python3 .morphogen/make_cases.py --seed-env SEED --out "cases/$set"
          fi
          cd cases
          git checkout -q -B main
          git add -A
          git -c user.name=morphogen-judge -c user.email=judge@invalid commit -qm "$set (MetaSoar)"
          git -c "$auth" push -q origin main
          echo "case set pushed"
